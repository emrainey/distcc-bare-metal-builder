name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Tag with tool versions
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          BASE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)

          DISTCC_VER=$(docker run --rm --entrypoint /bin/bash "$BASE_TAG" -c 'distccd --version 2>&1' | head -1 | awk '{print $2}')
          GCC_VER=$(docker run --rm --entrypoint /bin/bash "$BASE_TAG" -c 'gcc --version 2>&1' | head -1 | awk '{print $NF}')
          ARM_GCC_VER=$(docker run --rm --entrypoint /bin/bash "$BASE_TAG" -c 'arm-none-eabi-gcc --version 2>&1' | head -1 | awk '{print $(NF-1)}')
          CLANG_VER=$(docker run --rm --entrypoint /bin/bash "$BASE_TAG" -c 'clang-22 --version 2>&1' | head -1 | awk '{print $4}')

          COMPOSITE="gcc${GCC_VER}-armgcc${ARM_GCC_VER}-clang${CLANG_VER}"

          docker tag "$BASE_TAG" "${IMAGE}:${COMPOSITE}"
          docker tag "$BASE_TAG" "${IMAGE}:distcc-${DISTCC_VER}"
          docker tag "$BASE_TAG" "${IMAGE}:gcc-${GCC_VER}"
          docker tag "$BASE_TAG" "${IMAGE}:arm-none-eabi-gcc-${ARM_GCC_VER}"
          docker tag "$BASE_TAG" "${IMAGE}:clang-${CLANG_VER}"

          docker push "${IMAGE}:${COMPOSITE}"
          docker push "${IMAGE}:distcc-${DISTCC_VER}"
          docker push "${IMAGE}:gcc-${GCC_VER}"
          docker push "${IMAGE}:arm-none-eabi-gcc-${ARM_GCC_VER}"
          docker push "${IMAGE}:clang-${CLANG_VER}"
